<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mGlobal Pont Bascule — Plateforme distante</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Écran de connexion -->
  <div id="login">
    <form class="card" id="loginForm">
      <div class="brand">
        <div class="logo">⚖</div>
        <h1>mGlobal Pont Bascule</h1>
        <p>Plateforme de gestion distante</p>
      </div>
      <label>Identifiant</label>
      <input id="lUser" autocomplete="username" placeholder="Votre identifiant">
      <label>Mot de passe</label>
      <input id="lPass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" type="submit">Se connecter</button>
      <div class="err" id="lErr"></div>
      <div class="hint" style="text-align:center;margin-top:16px">
        Accès sans compte :
        <a href="/portail.html">Espace client</a> ·
        <a href="/portail-fournisseur.html">Espace fournisseur</a>
      </div>
    </form>
  </div>

  <!-- Application -->
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="top">
        <div class="name">⚖ mGlobal</div>
        <div class="sub" id="spaceName">—</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="bottom"><button class="logout" id="btnLogout">🚪 Déconnexion</button></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="ttl" id="pageTitle">Dashboard</div>
        <div class="who" id="who"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="modalHost"></div>
  <script src="/app.js"></script>
</body>
</html>
